[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amd-gpu-oc-toolkit"
version = "0.1.0"
description = "AMD GPU overclocking, fan control and monitoring toolkit for Linux (amdgpu sysfs, zero dependencies)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "fitzypopper" }]
keywords = ["amd", "amdgpu", "overclock", "gpu", "fan-control", "monitoring", "linux", "sysfs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/fitzypopper/amd-gpu-oc-toolkit"
Repository = "https://github.com/fitzypopper/amd-gpu-oc-toolkit"

[project.scripts]
amdoc = "amdoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
